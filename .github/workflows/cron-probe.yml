# Minimal schedule-only probe: proves whether GitHub's cron scheduler works for
# this account at all (no concurrency/permissions/pipeline involved).
# Safe to delete once the main fleet.yml schedule is validated.
name: Cron Probe

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        run: echo "cron fired at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
